<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Mã Số Thuế</title>
    <!-- Thư viện SheetJS để đọc file Excel trực tiếp -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background-color: #f4f7f6; 
        }
        h2 { 
            text-align: center; 
            color: #333; 
        }
        .container { 
            max-width: 1200px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
        }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 16px;
        }
        .table-container {
            overflow-x: auto;
            max-height: 75vh;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 10px; 
            text-align: left; 
        }
        th { 
            background-color: #007bff; 
            color: white; 
            position: sticky; 
            top: 0; 
            z-index: 1;
        }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        .loading { 
            text-align: center; 
            font-style: italic; 
            color: #666; 
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Tra Cứu Danh Sách Mã Số Thuế</h2>
    <input type="text" id="searchInput" placeholder="Nhập tên, mã số thuế, mã PNN hoặc thôn/xã để tìm kiếm..." onkeyup="searchTable()">
    
    <div id="loading" class="loading">Đang tự động tải dữ liệu từ file Excel, vui lòng đợi...</div>
    
    <div class="table-container">
        <table id="dataTable" style="display:none;">
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã Số Thuế</th>
                    <th>Tên Người Nộp Thuế</th>
                    <th>Mã Phi Nông Nghiệp</th>
                    <th>Thôn/Tổ Cũ</th>
                    <th>Thôn Mới</th>
                    <th>Phường/Xã</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    // Tên file của bạn
    const fileName = "DSmasothue.xls";

    fetch(fileName)
        .then(response => {
            if (!response.ok) throw new Error("Không tìm thấy file Excel.");
            return response.arrayBuffer();
        })
        .then(data => {
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // ĐIỂM SỬA LỖI: Sử dụng header: "A" để map chính xác dữ liệu vào các cột A,B,C,D... của Excel
            // tránh tuyệt đối tình trạng cột trống bị dồn sang trái.
            const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: "A", range: 3, defval: ""});
            
            populateTable(jsonData);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dataTable').style.display = 'table';
        })
        .catch(error => {
            document.getElementById('loading').innerHTML = `<span style="color:red;">Lỗi: ${error.message} <br>Hãy đảm bảo file <b>${fileName}</b> đã được tải lên server.</span>`;
        });

    function populateTable(data) {
        const tbody = document.getElementById('tableBody');
        
        data.forEach(row => {
            // Kiểm tra Cột C (Tên Người Nộp Thuế) có dữ liệu thì mới hiển thị dòng
            if (row["C"] && row["C"].toString().trim() !== "") {
                const tr = document.createElement('tr');
                
                // Lấy đúng theo tọa độ cột trong Excel
                const cols = [
                    row["A"], // STT
                    row["B"], // MÃ SỐ THUẾ
                    row["C"], // TÊN NGƯỜI NỘP THUẾ
                    row["D"], // MÃ PHI NÔNG NGHIỆP
                    row["E"], // THÔN/TỔ CŨ
                    row["F"], // THÔN MỚI
                    row["G"]  // PHƯỜNG/XÃ
                ];
                
                cols.forEach(text => {
                    const td = document.createElement('td');
                    td.innerText = (text !== undefined && text !== null) ? text : "";
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            }
        });
    }

    function searchTable() {
        const input = document.getElementById("searchInput");
        const filter = input.value.toUpperCase();
        const table = document.getElementById("dataTable");
        const tr = table.getElementsByTagName("tr");

        for (let i = 1; i < tr.length; i++) {
            let visible = false;
            const tds = tr[i].getElementsByTagName("td");
            // Duyệt qua tất cả các cột để tìm kiếm (trừ STT)
            for (let j = 1; j < tds.length; j++) {
                if (tds[j]) {
                    const txtValue = tds[j].textContent || tds[j].innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        visible = true;
                        break;
                    }
                }
            }
            tr[i].style.display = visible ? "" : "none";
        }
    }
</script>

</body>
</html>
